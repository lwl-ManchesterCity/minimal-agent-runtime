[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-agent-runtime"
version = "0.1.0"
description = "A framework-free minimal Agent Runtime for an interview exercise"
requires-python = ">=3.10"
dependencies = ["openai>=1.0.0"]

[tool.pytest.ini_options]
markers = ["real_llm: calls the real DeepSeek API and requires DEEPSEEK_API_KEY"]
